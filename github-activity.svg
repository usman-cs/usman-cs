  <text x="28" y="41" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#f0f6fc">GitHub overview</text>
  <line x1="28" y1="56" x2="752" y2="56" stroke="#30363d"/>
