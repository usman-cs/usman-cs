
name: Refresh GitHub profile statistics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build aggregate stats card
        env:
          GH_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/update_profile_stats.py

      - name: Commit updated card only when values change
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add profile/github-activity.svg
          if git diff --cached --quiet; then
            echo "Statistics have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile activity statistics"
          git push origin "HEAD:${DEFAULT_BRANCH}"
